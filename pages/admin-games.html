<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameLog - Manajemen Game</title>
    <link rel="stylesheet" href="../base.css">
    <link rel="stylesheet" href="../assets/css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500,600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .section-header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .section-header-flex .section-title {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }
        .search-admin-input {
            padding: 8px 14px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            outline: none;
            width: 240px;
            transition: border 0.2s;
        }
        .search-admin-input:focus {
            border-color: #818cf8;
        }
    </style>
</head>
<body>

    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content">
        <div class="admin-wrapper">
            
            <div class="admin-header">
                <h2><i data-lucide="gamepad-2"></i> Manajemen Game</h2>
                <p>Tambah game baru atau kelola daftar game yang sudah terdaftar.</p>
            </div>

            <div id="status-msg" style="display: none; padding: 12px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; margin-bottom: 20px;"></div>

            <!-- SEKSI 1: TAMBAH GAME BARU -->
            <section class="admin-section">
                <div class="section-title">
                    <h3><i data-lucide="plus-circle"></i> Tambah Game Baru</h3>
                </div>
                <form id="add-game-form" class="admin-form-card">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="game-title">Judul Game</label>
                            <input type="text" id="game-title" class="form-control" placeholder="Contoh: Valorant" required autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label for="game-genre">Genre Game</label>
                            <input type="text" id="game-genre" class="form-control" placeholder="Contoh: Tactical FPS" required autocomplete="off">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="game-cover-file">Unggah File Cover Gambar (Opsional)</label>
                        <input type="file" id="game-cover-file" class="form-control" accept="image/*">
                    </div>
                    <div class="form-group">
                        <label for="game-cover-url">Atau URL Gambar Cover (Opsional)</label>
                        <input type="url" id="game-cover-url" class="form-control" placeholder="https://example.com/cover.jpg">
                    </div>
                    <button type="submit" id="btn-add-game" class="primary-btn">
                        <i data-lucide="plus"></i> Tambahkan Game
                    </button>
                </form>
            </section>

            <!-- SEKSI 2: DAFTAR GAME TERDAFTAR (DENGAN SEARCH) -->
            <section class="admin-section">
                <div class="section-header-flex">
                    <div class="section-title">
                        <h3><i data-lucide="list"></i> Daftar Game</h3>
                    </div>
                    <input type="text" id="search-games" class="search-admin-input" placeholder="Cari judul / genre game...">
                </div>
                <div class="table-container">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Cover</th>
                                <th>Judul Game</th>
                                <th>Genre</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="games-table-body">
                            <tr><td colspan="5" class="table-loading">Memuat data game...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>

        </div>
    </main>

    <!-- Edit Game Modal -->
    <div class="modal-overlay" id="edit-game-modal">
        <div class="modal-box" style="background:#1a2e3a;border-radius:12px;padding:24px;width:90%;max-width:450px;color:#fff;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                <h3 style="margin:0;font-size:18px;">Edit Game</h3>
                <button id="close-edit-modal" style="background:none;border:none;color:#94a3b8;font-size:24px;cursor:pointer;">&times;</button>
            </div>
            <form id="edit-game-form">
                <input type="hidden" id="edit-game-id">
                <div class="form-group" style="margin-bottom:16px;">
                    <label style="display:block;font-size:13px;margin-bottom:6px;color:#94a3b8;">Judul Game</label>
                    <input type="text" id="edit-game-title" class="form-control" style="width:100%;padding:10px 14px;background:#000000;border:1px solid #2a4a5a;border-radius:8px;color:#fff;font-size:14px;outline:none;" required>
                </div>
                <div class="form-group" style="margin-bottom:16px;">
                    <label style="display:block;font-size:13px;margin-bottom:6px;color:#94a3b8;">Genre Game</label>
                    <input type="text" id="edit-game-genre" class="form-control" style="width:100%;padding:10px 14px;background:#000000;border:1px solid #2a4a5a;border-radius:8px;color:#fff;font-size:14px;outline:none;" required>
                </div>
                <div class="form-group" style="margin-bottom:20px;">
                    <label style="display:block;font-size:13px;margin-bottom:6px;color:#94a3b8;">URL Gambar Cover (Opsional)</label>
                    <input type="url" id="edit-game-cover" class="form-control" style="width:100%;padding:10px 14px;background:#000000;border:1px solid #2a4a5a;border-radius:8px;color:#fff;font-size:14px;outline:none;">
                </div>
                <button type="submit" class="primary-btn" style="width:100%;padding:12px;border:none;border-radius:8px;font-weight:600;cursor:pointer;background:#FE7F2D;color:#fff;">Simpan Perubahan</button>
            </form>
        </div>
    </div>

    <script src="../assets/js/admin.js"></script>
    <script src="../assets/js/sidebar.js"></script>
</body>
</html>
