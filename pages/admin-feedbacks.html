<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameLog - Feedback</title>
    <link rel="stylesheet" href="../base.css">
    <link rel="stylesheet" href="../assets/css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400,500,600,700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content">
        <div class="admin-wrapper">
            
            <div class="admin-header">
                <h2><i data-lucide="mail"></i> Laporan & Feedback</h2>
                <p>Lihat feedback dan request game dari user.</p>
            </div>

            <div id="status-msg" style="display: none; padding: 12px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; margin-bottom: 20px;"></div>

            <!-- SEKSI: LAPORAN & FEEDBACK -->
            <section class="admin-section">
                <div class="section-title">
                    <h3><i data-lucide="mail"></i> Feedback Masuk</h3>
                </div>
                <div class="table-container">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Pengirim</th>
                                <th>Post ID</th>
                                <th>Pesan Feedback</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="feedbacks-table-body">
                            <tr><td colspan="5" class="table-loading">Memuat data feedback...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>

        </div>
    </main>

    <script src="../assets/js/admin.js"></script>
    <script src="../assets/js/sidebar.js"></script>
</body>
</html>
